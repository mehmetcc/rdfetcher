[package]
name = "rdfetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
anyhow = "1.0.100"
serde_json = "1.0.145"
dotenv = "0.15.0"
scraper = "0.24.0"
serde = { version = "1.0.219", features = ["derive"] }
config = "0.15.11"
